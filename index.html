<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="FitFuel">
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/icon-180.png"><title>FitFuel</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--a:#2563eb;--ab:#dbeafe;--g:#16a34a;--gb:#dcfce7;--r:#dc2626;--rb:#fee2e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:94px}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 14px) 17px 13px}.head,main{max-width:780px;margin:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;font-size:27px}h2{margin:0 0 5px;font-size:21px}h3{margin:0 0 8px;font-size:17px}.muted{color:var(--muted)}.small{font-size:12px}
main{padding:15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 2px 12px #00000008}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8fafc;border-radius:14px;padding:12px}.stat b{font-size:20px}
button{border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:750;font-size:15px;padding:11px 13px}button.secondary{background:var(--ab);color:#1e3a8a}button.ghost{background:#f3f4f6;color:var(--ink)}button.danger{background:var(--rb);color:#991b1b}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}textarea{min-height:80px}.form{display:grid;gap:9px}.stack{display:grid;gap:9px}
.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:var(--ab);color:#1e40af;font-size:12px;font-weight:750}.pill.good{background:var(--gb);color:#166534}
.progress{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--a);border-radius:9px}
.exercise,.recipe,.day{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px}.sets{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.set{min-width:58px;background:#f3f4f6;color:var(--ink);padding:9px}.set.done{background:var(--gb);color:#166534}
.meal{border-top:1px solid var(--line);padding:12px 0}.meal:first-child{border-top:0}.meal.eaten{opacity:.62}.meal button{padding:8px 10px;font-size:13px}
.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}.nav button{background:transparent;color:var(--muted);font-size:11px;padding:5px 7px}.nav button.active{color:var(--a)}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.list{display:grid;gap:7px}.item{padding:10px;border-bottom:1px solid var(--line)}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><div class="head"><div class="row"><div><h1>FitFuel</h1><div class="muted small">Strength • Nutrition • Recipes • Progress</div></div><span id="week" class="pill"></span></div></div></header>
<main id="app"></main>
<nav class="nav"><button data-tab="today">🏠<br>Today</button><button data-tab="workout">🏋️<br>Workout</button><button data-tab="nutrition">🍽️<br>Meals</button><button data-tab="progress">📈<br>Progress</button><button data-tab="more">☰<br>More</button></nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const KEY="fitfuel_v4";
const defaults={weight:223,goalMin:180,goalMax:185,calories:2150,protein:200,fat:70,waterGoal:100,tab:"today",week:0,done:{},logs:[],water:{},eaten:{},recipes:[],mealPlan:{},grocery:{},schedule:3,restTimer:60};
let s=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||"{}"));s.done||={};s.logs||=[];s.water||={};s.eaten||={};s.recipes||=[];s.mealPlan||={};s.grocery||={};
const workouts=[
[{name:"Monday",focus:"Strength A",ex:[["Goblet Squat",3,10,"Hold a DB/KB at chest."],["DB Bench Press",3,10,"Controlled press; shoulder blades supported."],["Supported 1-Arm DB Row",3,10,"Brace on bench/chair."],["DB Glute Bridge",3,12,"Squeeze glutes without arching."],["Dead Bug",3,8,"Slow opposite arm/leg."],["Side Plank",3,25,"Seconds; shorten lever if needed."]]},
{name:"Wednesday",focus:"Strength B",ex:[["DB Box Squat",3,10,"Use stable chair/bench."],["DB Overhead Press",3,10,"Comfortable shoulder range."],["Chest-Supported DB Row",3,10,"Pull elbows back."],["DB Hip Thrust",3,12,"Drive through feet."],["Bird Dog",3,8,"Resist trunk rotation."],["Suitcase Carry",3,30,"Seconds per side."]]},
{name:"Friday",focus:"Strength C",ex:[["Supported DB Split Squat",3,8,"Use support."],["Incline Push-Up",3,10,"Use a high surface if needed."],["Supported 1-Arm DB Row",3,10,"Brace torso."],["Elevated KB Deadlift",3,10,"Shorter range."],["KB Swing / Hip Hinge",3,12,"Only if hinge is comfortable."],["Plank",3,25,"Stop before form breaks."]]}],
[{name:"Monday",focus:"Lower + Push",ex:[["DB Romanian Deadlift",3,10,"Short comfortable range."],["DB Floor Press",3,10,"Controlled lowering."],["Goblet Squat",3,12,"Use chair target if useful."],["DB Glute Bridge",3,15,"Pause at top."],["Dead Bug",3,10,"Slow core work."]]},
{name:"Wednesday",focus:"Upper + Core",ex:[["Chest-Supported DB Row",4,10,"Support chest."],["Seated DB Press",3,10,"Back supported if helpful."],["Incline Push-Up",3,12,"Choose an appropriate height."],["Suitcase Carry",3,35,"Seconds per side."],["Side Plank",3,30,"Seconds per side."]]},
{name:"Friday",focus:"Full Body",ex:[["DB Step-Up",3,8,"Low stable step."],["DB Bench Press",3,10,"Controlled."],["1-Arm DB Row",3,10,"Use support."],["KB Deadlift",3,12,"Keep load close."],["Bird Dog",3,10,"Slow."],["Plank",3,30,"Stop before form breaks."]]}],
[{name:"Monday",focus:"Strength A",ex:[["Goblet Squat",4,8,"Strength reps."],["DB Bench Press",4,8,"Challenging but clean."],["Supported 1-Arm Row",4,8,"Brace on support."],["DB Hip Thrust",3,10,"Strong glute squeeze."],["Dead Bug",3,10,"Slow."]]},
{name:"Wednesday",focus:"Strength B",ex:[["DB Box Squat",4,8,"Stable target."],["DB Overhead Press",3,8,"Comfortable range."],["Chest-Supported Row",4,8,"Controlled."],["DB Glute Bridge",3,12,"Pause at top."],["Suitcase Carry",3,40,"Seconds per side."]]},
{name:"Friday",focus:"Strength C",ex:[["Supported Split Squat",3,8,"Use support."],["Incline Push-Up",3,12,"Controlled."],["1-Arm Row",4,8,"Supported."],["Elevated KB Deadlift",4,8,"Shorter range."],["Side Plank",3,30,"Seconds per side."]]}],
[{name:"Monday",focus:"Deload Full Body",ex:[["Goblet Squat",2,10,"Easy/moderate."],["DB Bench Press",2,10,"Leave reps in reserve."],["Supported Row",2,10,"Easy/moderate."],["Glute Bridge",2,12,"Controlled."],["Dead Bug",2,8,"Easy."]]},
{name:"Wednesday",focus:"Core + Mobility",ex:[["DB Box Squat",2,10,"Easy/moderate."],["Incline Push-Up",2,10,"Easy/moderate."],["Chest-Supported Row",2,10,"Easy/moderate."],["Bird Dog",2,8,"Slow."],["Side Plank",2,20,"Seconds."]]},
{name:"Friday",focus:"Full Body Easy",ex:[["DB Step-Up",2,8,"Low step."],["DB Floor Press",2,10,"Easy/moderate."],["1-Arm Row",2,10,"Supported."],["KB Deadlift",2,10,"Easy/moderate."],["Plank",2,20,"Seconds."]]}]
];
const starter=[
["Greek Yogurt Protein Bowl","Breakfast",430,45,42,8,"Greek yogurt; protein powder; berries; granola","Mix yogurt and protein powder. Top with berries and measured granola."],
["Chicken Fajita Bowl","Lunch",570,55,50,14,"Chicken breast; rice; peppers; onions; black beans; salsa","Cook chicken with fajita seasoning. Prep rice and vegetables. Portion and top with salsa."],
["Lean Beef Taco Bowl","Dinner",620,55,48,20,"93% lean beef; rice or potatoes; lettuce; pico; light cheese","Brown beef with taco seasoning. Add carb, lettuce, pico and cheese."],
["Protein Shake","Snack",300,35,28,7,"Protein powder; milk or almond milk; banana","Blend until smooth."],
["Cottage Cheese Berry Bowl","Snack",220,28,16,4,"Cottage cheese; berries","Combine and serve cold."],
["High-Protein Chicken Pasta","Dinner",590,55,50,15,"Chicken breast; protein pasta; marinara; parmesan; spinach","Cook pasta and chicken. Combine with marinara and spinach; finish with parmesan."],
["Turkey Burger Bowl","Lunch",540,52,44,15,"Lean ground turkey; potatoes; lettuce; tomato; pickles; Greek-yogurt sauce","Cook turkey. Roast potatoes. Serve over greens with toppings."],
["Egg & Turkey Breakfast Bowl","Breakfast",420,42,18,20,"Eggs; egg whites; turkey sausage; peppers; potatoes","Cook sausage and vegetables, add eggs/egg whites, serve with potatoes."],
["Chicken Caesar Protein Wrap","Lunch",520,50,34,17,"Chicken breast; high-protein wrap; romaine; light Caesar dressing; parmesan","Cook chicken, slice, fill wrap with romaine, dressing and parmesan."],
["Turkey Chili","Dinner",560,52,44,16,"Lean ground turkey; black beans; tomatoes; peppers; onions; chili seasoning","Brown turkey. Add remaining ingredients and simmer until thick."],
["Overnight Protein Oats","Breakfast",440,40,48,10,"Oats; Greek yogurt; protein powder; milk; berries","Mix and refrigerate overnight."],
["Buffalo Chicken Bowl","Dinner",540,55,42,13,"Chicken breast; rice; buffalo sauce; broccoli; Greek yogurt","Cook chicken, toss with buffalo sauce, serve over rice and broccoli with yogurt sauce."]
];
function allRecipes(){return starter.concat(s.recipes)}
function recObj(r){return{name:r[0],cat:r[1],cal:+r[2],p:+r[3],c:+r[4],f:+r[5],ingredients:r[6],steps:r[7]}}
function recipes(){return allRecipes().map(x=>Array.isArray(x)?recObj(x):x)}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function date(){return new Date().toISOString().slice(0,10)}
function dayName(i){return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][i]}
function plan(){return workouts[s.week%4]}
function todayWorkout(){let d=new Date().getDay(),i=d===1?0:d===3?1:d===5?2:0;return plan()[i]}
function macroTotals(items){return items.reduce((a,r)=>({cal:a.cal+r.cal,p:a.p+r.p,c:a.c+r.c,f:a.f+r.f}),{cal:0,p:0,c:0,f:0})}
function render(){document.getElementById("week").textContent="Week "+(s.week+1);document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===s.tab));({today:today,workout:workout,nutrition:nutrition,progress:progress,more:more}[s.tab])(document.getElementById("app"))}
function today(a){let w=todayWorkout(),[d,t]=done(w),water=s.water[date()]||0,mp=getWeekMeals(),todayMeals=mp[dayName(new Date().getDay())]||[];let mt=macroTotals(todayMeals);
a.innerHTML=`<div class="card"><div class="row"><div><div class="muted small">TODAY • ${dayName(new Date().getDay())}</div><h2>${w.name} • ${w.focus}</h2></div><span class="pill">${d}/${t} sets</span></div><div class="progress"><i style="width:${d/t*100}%"></i></div><p class="muted">Back-friendly strength with core and glute emphasis. Stop a movement if pain is sharp or worsening.</p><button onclick="s.tab='workout';save();render()">Start Workout</button></div>
<div class="grid"><div class="stat"><span class="muted">Calories</span><br><b>${s.calories}</b><br><span class="small">target</span></div><div class="stat"><span class="muted">Protein</span><br><b>${s.protein}g</b><br><span class="small">target</span></div><div class="stat"><span class="muted">Water</span><br><b>${water}</b> oz<br><span class="small">goal ${s.waterGoal}</span></div><div class="stat"><span class="muted">Planned</span><br><b>${mt.cal}</b><br><span class="small">${mt.p}g protein</span></div></div>
<div class="card"><div class="row"><div><h3>Water</h3><div class="muted small">Quick add</div></div><b>${Math.min(100,Math.round(water/s.waterGoal*100))}%</b></div><div class="progress"><i style="width:${Math.min(100,water/s.waterGoal*100)}%"></i></div><br><div class="grid3"><button class="secondary" onclick="water(8)">+8</button><button class="secondary" onclick="water(16)">+16</button><button class="secondary" onclick="water(24)">+24 oz</button></div></div>
<div class="card"><div class="row"><div><h3>Today's Meals</h3><div class="muted">${todayMeals.length} planned recipes</div></div><button class="secondary" onclick="s.tab='nutrition';save();render()">View</button></div></div>`}
function done(w){let d=0,t=0;w.ex.forEach((e,i)=>{for(let j=1;j<=e[1];j++){t++;if(s.done[`${s.week}-${w.name}-${i}-${j}`])d++}});return[d,t]}
function workout(a){let w=todayWorkout(),[d,t]=done(w);let h=`<div class="card"><div class="row"><div><div class="muted small">WEEK ${s.week+1}</div><h2>${w.name} • ${w.focus}</h2></div><span class="pill">${d}/${t}</span></div><div class="progress"><i style="width:${d/t*100}%"></i></div><br><button class="secondary" onclick="timer()">⏱ ${s.restTimer}s Rest Timer</button>`;
w.ex.forEach((e,i)=>{h+=`<div class="exercise"><div class="row"><b>${i+1}. ${e[0]}</b><span class="muted">${e[1]} × ${e[2]}</span></div><div class="muted small">${e[3]}</div><div class="sets">`;for(let j=1;j<=e[1];j++){let k=`${s.week}-${w.name}-${i}-${j}`;h+=`<button class="set ${s.done[k]?"done":""}" onclick="setDone('${k}')">${s.done[k]?"✓ ":""}Set ${j}</button>`}h+=`</div></div>`});h+=`<br><button class="ghost" onclick="resetW()">Reset Sets</button></div>`;a.innerHTML=h}
function setDone(k){s.done[k]=!s.done[k];save();render()}function resetW(){if(confirm("Reset today's sets?")){let w=todayWorkout();w.ex.forEach((e,i)=>{for(let j=1;j<=e[1];j++)delete s.done[`${s.week}-${w.name}-${i}-${j}`]});save();render()}}
function timer(){let n=s.restTimer;alert(`Rest timer started for ${n} seconds. Keep your phone visible; a simple alert will appear when you finish.`);setTimeout(()=>alert("Rest complete — next set!"),n*1000)}
function water(n){s.water[date()]=(s.water[date()]||0)+n;save();render()}
function getWeekMeals(){if(!s.mealPlan.generated)generateMeals(false);return s.mealPlan.days}
function nutrition(a){let mp=getWeekMeals();let days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];let h=`<div class="card"><div class="row"><div><h2>Weekly Meal Plan</h2><div class="muted">Built from your recipe database</div></div><button onclick="generateMeals(true)">🔄 Regenerate</button></div><p class="muted small">The generator prioritizes your calorie/protein targets and rotates your saved recipes. You can regenerate whenever you want a different week.</p></div>`;
days.forEach(day=>{let items=mp[day]||[],mt=macroTotals(items);h+=`<div class="day"><div class="row"><div><h3>${day}</h3><span class="pill">${mt.cal} cal • ${mt.p}g P</span></div><button class="ghost" onclick="showDay('${day}')">Edit</button></div>`;items.forEach((r,i)=>{let k=`${day}-${i}`,eat=s.eaten[k];h+=`<div class="meal ${eat?"eaten":""}"><div class="row"><div><b>${r.name}</b><div class="muted small">${r.cat} • ${r.cal} cal • ${r.p}g P • ${r.c}g C • ${r.f}g F</div></div><button class="${eat?"ghost":"secondary"}" onclick="eat('${k}')">${eat?"✓ Eaten":"Mark Eaten"}</button></div></div>`});h+=`</div>`});
h+=`<div class="card"><div class="row"><div><h2>Grocery List</h2><div class="muted">Generated from this week's meals</div></div><button class="secondary" onclick="grocerySheet()">Open</button></div><p class="muted">Ingredients are aggregated from every selected recipe. Because custom recipes can use free-form ingredient text, the list groups exact ingredient entries rather than guessing quantities.</p></div>`;
a.innerHTML=h}
function generateMeals(show=true){let rs=recipes(),cats={Breakfast:rs.filter(r=>r.cat.toLowerCase().includes("break")),Lunch:rs.filter(r=>r.cat.toLowerCase().includes("lunch")),Dinner:rs.filter(r=>r.cat.toLowerCase().includes("dinner")),Snack:rs.filter(r=>r.cat.toLowerCase().includes("snack"))};Object.values(cats).forEach(x=>{if(!x.length)x=rs});let days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],out={};
days.forEach((d,di)=>{let b=(cats.Breakfast.length?cats.Breakfast:rs)[di%Math.max(1,cats.Breakfast.length)],l=(cats.Lunch.length?cats.Lunch:rs)[(di+1)%Math.max(1,cats.Lunch.length)],dn=(cats.Dinner.length?cats.Dinner:rs)[(di+2)%Math.max(1,cats.Dinner.length)],sn=(cats.Snack.length?cats.Snack:rs)[(di+3)%Math.max(1,cats.Snack.length)];let arr=[b,l,dn,sn];let total=macroTotals(arr);let extra=rs.filter(r=>r.cat.toLowerCase().includes("snack")&&r.name!==sn.name);if(total.p<s.protein-25&&extra.length)arr.push(extra[di%extra.length]);out[d]=arr});
s.mealPlan={generated:true,days:out,created:new Date().toISOString()};buildGrocery();save();if(show){render();toast("New meal plan generated")}}
function eat(k){s.eaten[k]=!s.eaten[k];save();render()}
function showDay(day){let items=s.mealPlan.days[day]||[];open(`<div class="row"><h2>${day}</h2><button class="ghost" onclick="close()">Close</button></div><p class="muted">Choose from your recipe database.</p><div class="stack">${items.map((r,i)=>`<div class="recipe"><div class="row"><b>${r.name}</b><button class="danger" onclick="removeMeal('${day}',${i})">Remove</button></div><div class="muted small">${r.cal} cal • ${r.p}g P</div></div>`).join("")}</div><br><button onclick="addMealToDay('${day}')">+ Add Recipe</button>`)}
function removeMeal(day,i){s.mealPlan.days[day].splice(i,1);buildGrocery();save();showDay(day)}
function addMealToDay(day){let rs=recipes();open(`<div class="row"><h2>Add to ${day}</h2><button class="ghost" onclick="close()">Close</button></div><div class="list">${rs.map((r,i)=>`<button class="ghost" style="text-align:left" onclick="chooseMeal('${day}',${i})"><b>${r.name}</b><br><span class="small">${r.cat} • ${r.cal} cal • ${r.p}g P</span></button>`).join("")}</div>`)}
function chooseMeal(day,i){s.mealPlan.days[day].push(recipes()[i]);buildGrocery();save();showDay(day)}
function buildGrocery(){let map={};Object.values(s.mealPlan.days||{}).flat().forEach(r=>{String(r.ingredients||"").split(/[;,\n]/).map(x=>x.trim()).filter(Boolean).forEach(x=>{let k=x.toLowerCase();map[k]=(map[k]||{name:x,qty:0});map[k].qty++})});s.grocery=map}
function grocerySheet(){buildGrocery();let arr=Object.values(s.grocery).sort((a,b)=>a.name.localeCompare(b.name));open(`<div class="row"><h2>Weekly Grocery List</h2><button class="ghost" onclick="close()">Close</button></div><p class="muted small">Each line represents how many selected recipes use that ingredient entry.</p>${arr.length?arr.map(x=>`<label class="check item"><input type="checkbox"> <span>${x.name} <span class="pill">${x.qty}</span></span></label>`).join(""):`<div class="muted">No ingredients yet.</div>`}<br><button class="secondary" onclick="window.print()">Print / Save PDF</button>`)}
function recipeDB(a){let rs=recipes();return rs}
function progress(a){let vals=s.logs.slice(-14).map(x=>x.weight),cur=s.weight||223,lost=Math.max(0,223-cur);a.innerHTML=`<div class="card"><h2>Progress</h2><div class="grid"><div class="stat"><span class="muted">Current</span><br><b>${cur}</b> lb</div><div class="stat"><span class="muted">Goal</span><br><b>${s.goalMin}–${s.goalMax}</b> lb</div><div class="stat"><span class="muted">Change</span><br><b>${lost.toFixed(1)}</b> lb</div><div class="stat"><span class="muted">Pace</span><br><b>1–2</b> lb/wk</div></div></div><div class="card"><h3>Weight check-in</h3><div class="form"><input id="pw" type="number" value="${cur}" placeholder="Weight (lb)"><input id="pwa" type="number" placeholder="Waist (inches)"><button onclick="saveP()">Save Check-in</button></div></div><div class="card"><h3>Recent weights</h3>${s.logs.slice(-10).reverse().map(x=>`<div class="item">${x.date} — <b>${x.weight} lb</b>${x.waist?` — ${x.waist}" waist`:""}</div>`).join("")||"<div class='muted'>No check-ins yet.</div>"}</div>`}
function saveP(){let w=+document.getElementById("pw").value;if(!w)return;let wa=+document.getElementById("pwa").value||null;s.weight=w;s.logs.push({date:date(),weight:w,waist:wa});save();render()}
function more(a){a.innerHTML=`<div class="card"><h2>Settings</h2><div class="form"><label>Calories<input id="cal" type="number" value="${s.calories}"></label><label>Protein (g)<input id="pro" type="number" value="${s.protein}"></label><label>Fat (g)<input id="fat" type="number" value="${s.fat}"></label><label>Water goal (oz)<input id="wg" type="number" value="${s.waterGoal}"></label><label>Goal minimum<input id="gm" type="number" value="${s.goalMin}"></label><label>Goal maximum<input id="gx" type="number" value="${s.goalMax}"></label><label>Rest timer seconds<input id="rt" type="number" value="${s.restTimer}"></label><button onclick="settings()">Save Settings</button><button class="secondary" onclick="nextWeek()">Change Workout Week</button></div></div>
<div class="card"><div class="row"><div><h2>Recipe Database</h2><div class="muted">${recipes().length} recipes</div></div><button onclick="recipeList()">Manage</button></div><p class="muted">Your recipes are used by the weekly meal generator and grocery list.</p></div>
<div class="card"><h3>Backup & Restore</h3><div class="stack"><button class="ghost" onclick="backup()">Backup All Data</button><button class="ghost" onclick="restore()">Restore Backup</button><button class="danger" onclick="if(confirm('Reset all FitFuel data?')){localStorage.removeItem(KEY);location.reload()}">Reset App</button></div></div>
<div class="card"><h3>iPhone</h3><p class="muted">Host this folder at HTTPS, then Safari → Share → Add to Home Screen → Open as Web App → Add.</p><p class="muted small">This PWA stores data locally on this device/browser; it does not sync with Apple Health.</p></div>`}
function settings(){s.calories=+cal.value||2150;s.protein=+pro.value||200;s.fat=+fat.value||70;s.waterGoal=+wg.value||100;s.goalMin=+gm.value||180;s.goalMax=+gx.value||185;s.restTimer=+rt.value||60;save();render()}
function nextWeek(){s.week=(s.week+1)%4;s.done={};s.mealPlan={};generateMeals(false);save();render()}
function recipeList(){let rs=recipes();open(`<div class="row"><h2>Recipe Database</h2><button class="ghost" onclick="close()">Close</button></div><br><button onclick="recipeForm()">+ Add Recipe</button><br><br>${rs.map((r,i)=>`<div class="recipe"><div class="row"><b>${r.name}</b>${i>=starter.length?`<button class="danger" onclick="delRecipe(${i-starter.length})">Delete</button>`:""}</div><div class="muted small">${r.cat} • ${r.cal} cal • ${r.p}g P • ${r.c}g C • ${r.f}g F</div><div class="small">${r.ingredients}</div></div>`).join("")}`)}
function recipeForm(){open(`<div class="row"><h2>Add Recipe</h2><button class="ghost" onclick="close()">Close</button></div><br><div class="form"><input id="rn" placeholder="Recipe name"><input id="rcat" placeholder="Category: Breakfast, Lunch, Dinner or Snack"><input id="rcal" type="number" placeholder="Calories"><input id="rp" type="number" placeholder="Protein (g)"><input id="rc" type="number" placeholder="Carbs (g)"><input id="rf" type="number" placeholder="Fat (g)"><textarea id="ring" placeholder="Ingredients — include quantities if you know them. Separate ingredients with semicolons."></textarea><textarea id="rst" placeholder="Directions"></textarea><button onclick="addRecipe()">Save Recipe</button></div>`)}
function addRecipe(){let n=rn.value.trim();if(!n){alert("Enter a recipe name.");return}s.recipes.push([n,rcat.value||"Other",+rcal.value||0,+rp.value||0,+rc.value||0,+rf.value||0,ring.value,rst.value]);s.mealPlan={};save();recipeList()}
function delRecipe(i){if(confirm("Delete this recipe?")){s.recipes.splice(i,1);s.mealPlan={};save();recipeList()}}
function open(x){document.getElementById("sheet").innerHTML=x;document.getElementById("modal").classList.add("show")}
function close(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")close()}
function backup(){let b=new Blob([JSON.stringify(s,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="fitfuel-backup.json";a.click()}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{s=Object.assign({},defaults,JSON.parse(r.result));save();render();alert("Backup restored.")}catch{alert("Invalid backup file.")}};r.readAsText(i.files[0])};i.click()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{s.tab=b.dataset.tab;save();render()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script></body></html>
