<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="./workouts.css?v=1"><script src="./workout-core.js?v=1"></script><script src="./workouts.js?v=1" defer></script>
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#111827"><title>FitFuel Family</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:18px 15px;position:sticky;top:0;z-index:20}h1{margin:0 0 4px;font-size:24px}.sub{font-size:13px;opacity:.75}nav{position:sticky;top:72px;z-index:19;background:#fff;padding:8px;display:flex;gap:7px;overflow:auto;border-bottom:1px solid #ddd}nav button{white-space:nowrap;background:#edf0f3;color:#17202a}nav button.active{background:#111827;color:#fff}main{max-width:900px;margin:auto;padding:14px 14px 80px}.card{background:#fff;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 1px 4px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{background:#f5f7fa;border-radius:10px;padding:12px}.stat b{display:block;font-size:20px}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px}button{border:0;border-radius:9px;padding:10px 13px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#e9edf2;color:#17202a}button.danger{background:#dc2626}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd3da;border-radius:9px;font:inherit;background:#fff}.recipe,.fooditem{border:1px solid #e1e5e9;border-radius:11px;padding:12px;margin:9px 0}.muted{color:#68737d;font-size:13px}.badge{display:inline-block;padding:4px 7px;border-radius:12px;background:#eaf2ff;color:#1d4ed8;font-size:11px;font-weight:700}.notice{background:#fff8e6;border:1px solid #f2d38b;padding:10px;border-radius:10px}.modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modalbox{background:#fff;border-radius:15px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:15px}.productimg{width:70px;height:70px;object-fit:contain;background:#f5f5f5;border-radius:8px}@media(max-width:600px){.two{grid-template-columns:1fr}}
.meal-recipe{display:block;width:100%;text-align:left;background:#fff;color:#17202a;font:inherit}.meal-recipe span{display:block;margin-top:6px}.meal-recipe:hover{background:#f5f8ff}.meal-recipe:focus-visible{outline:3px solid #2563eb;outline-offset:2px}.recipe-link{color:#1d4ed8;font-size:13px;font-weight:600}</style><script src="https://unpkg.com/html5-qrcode" defer></script></head><body>
<header><h1>FitFuel Family</h1><div class="sub" id="sub"></div></header><nav id="nav"></nav><main id="app"></main>
<script>
const API="./API/",today=()=>new Date().toISOString().slice(0,10),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));let s={authenticated:false,user:null,profile:{},recipes:[],food:[],water:0,progress:[],workouts:[],plans:{},family:[],family_info:null};
async function req(path,opt={}){let r=await fetch(API+path,{credentials:"include",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}}),j=await r.json().catch(()=>({success:false,message:"Server error."}));if(r.status===401){loginPage();throw Error(j.message||"Please log in.")}if(!r.ok||j.success===false)throw Error(j.message||"Request failed.");return j}
async function load(){let j=await req("api.php?action=bootstrap&date="+today());if(j)s={...s,...j,authenticated:true};return j}
function nav(a){document.getElementById("nav").innerHTML=["home:Today","workouts:Workouts","food:Food Log","recipes:Recipes","plan:Meal Plan","grocery:Groceries","family:Family","progress:Progress","settings:Settings"].map(x=>{let[q,w]=x.split(":");return`<button class="${a===q?"active":""}" onclick="show('${q}')">${w}</button>`}).join("")}
function header(){let p=s.profile||{},u=s.user;document.getElementById("sub").textContent=u?`${u.first_name} • ${p.daily_calorie_goal||0} cal • ${p.daily_protein_goal||0}g protein/day`:"Secure family account"}
async function show(a){if(typeof WorkoutUI!=="undefined"&&!WorkoutUI.leave())return;header();nav(a);if(a==="home")home();if(a==="workouts")await WorkoutUI.open();if(a==="food")food();if(a==="recipes")recipes();if(a==="plan")plan();if(a==="grocery")grocery();if(a==="family")family();if(a==="progress"){progress();WorkoutUI.bodyChart();}if(a==="settings")settings()}
function totals(){return s.food.reduce((z,x)=>({cal:z.cal+Number(x.calories||0)*Number(x.servings||1),pro:z.pro+Number(x.protein_g||0)*Number(x.servings||1)}),{cal:0,pro:0})}
function home(){let t=totals(),p=s.profile||{};app.innerHTML=`<div class="card"><h2>Today</h2><div class="grid"><div class="stat">Calories<b>${t.cal.toFixed(0)}</b><small>/ ${p.daily_calorie_goal||0}</small></div><div class="stat">Protein<b>${t.pro.toFixed(1)}g</b><small>/ ${p.daily_protein_goal||0}g</small></div><div class="stat">Water<b>${s.water.toFixed(0)} oz</b></div></div></div><div class="card"><h2>Quick Add</h2><div class="row"><button onclick="scan()">📷 Scan Barcode</button><button onclick="manual()">＋ Add Food</button><button onclick="show('recipes')">🍽 Recipes</button></div></div><div class="card"><h2>Today's Food</h2>${s.food.length?s.food.map(fi).join(""):"<p class='muted'>Nothing logged yet.</p>"}</div><div class="card"><h2>Water</h2><div class="row"><button onclick="water(8)">+8 oz</button><button onclick="water(16)">+16 oz</button><button onclick="water(24)">+24 oz</button></div></div><div class="card"><h2>Workout</h2><button onclick="show('workouts')">Open Workout Library</button></div>`}
function fi(x){return`<div class="fooditem"><div class="row" style="justify-content:space-between"><div><b>${esc(x.food_name)}</b>${x.brand?` <span class="badge">${esc(x.brand)}</span>`:""}<div class="muted">${x.meal_type} • ${x.servings} serving(s) • ${(Number(x.calories)*Number(x.servings)).toFixed(0)} cal • ${(Number(x.protein_g)*Number(x.servings)).toFixed(1)}g protein</div></div><button class="danger" onclick="delFood(${x.id})">Delete</button></div></div>`}
async function food(){await load();header();nav("food");app.innerHTML=`<div class="card"><h2>Food Log</h2><div class="row"><button onclick="scan()">📷 Scan Barcode</button><button onclick="manual()">＋ Add Food</button></div></div><div class="card">${s.food.length?s.food.map(fi).join(""):"<p class='muted'>No food logged today.</p>"}</div>`}
async function water(n){await req("api.php",{method:"POST",body:JSON.stringify({action:"water_add",ounces:n,log_date:today()})});await load();show("home")}
async function delFood(id){if(confirm("Delete this food entry?")){await req("api.php",{method:"POST",body:JSON.stringify({action:"food_delete",id})});await load();show("food")}}
function manual(p={}){app.innerHTML=`<div class="card"><h2>Add Food</h2><label>Food name</label><input id="fn" value="${esc(p.name||"")}"><div class="two"><div><label>Meal</label><select id="fm">${["breakfast","lunch","dinner","snack"].map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Servings</label><input id="fs" type="number" step=".1" value="${p.servings||1}"></div><div><label>Calories / serving</label><input id="fc" type="number" value="${p.calories||0}"></div><div><label>Protein g / serving</label><input id="fp" type="number" value="${p.protein_g||0}"></div><div><label>Carbs g / serving</label><input id="fcb" type="number" value="${p.carbs_g||0}"></div><div><label>Fat g / serving</label><input id="ff" type="number" value="${p.fat_g||0}"></div><div><label>Fiber g / serving</label><input id="ffi" type="number" value="${p.fiber_g||0}"></div><div><label>Brand</label><input id="fbr" value="${esc(p.brand||"")}"></div></div><label>Serving size</label><input id="fss" value="${esc(p.serving_size||"")}"><label>Notes</label><textarea id="fno"></textarea><div class="row"><button onclick="saveFood()">Save Food</button><button class="secondary" onclick="show('food')">Cancel</button></div></div>`}
async function saveFood(){if(!fn.value.trim())return alert("Enter a food name.");await req("api.php",{method:"POST",body:JSON.stringify({action:"food_add",food_date:today(),meal_type:fm.value,food_name:fn.value.trim(),servings:+fs.value||1,calories:+fc.value||0,protein_g:+fp.value||0,carbs_g:+fcb.value||0,fat_g:+ff.value||0,fiber_g:+ffi.value||0,brand:fbr.value,serving_size:fss.value,notes:fno.value,source:"manual"})});await load();show("food")}
let qr=null,scanEpoch=0,scanQueue=Promise.resolve();
const scanElement=id=>document.getElementById(id);
function scanMessage(message){let el=scanElement("scanStatus");if(el)el.textContent=message}
async function stopCamera(){const scanner=qr;qr=null;if(!scanner)return;try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}}
function preferredCamera(cameras){return cameras.find(c=>/^(back|rear) camera$/i.test(c.label))||cameras.find(c=>/back|rear|environment/i.test(c.label)&&!/ultra|tele|0[.,]5/i.test(c.label))}
function scan(){
 const epoch=++scanEpoch;
 app.innerHTML=`<div class="modal"><div class="modalbox"><h2>Scan Food Barcode</h2><p class="muted">Scans automatically — no shutter button needed. Hold the barcode about 6–12 inches away in good light, with all bars and both white edges visible.</p><label for="scanCamera">Camera</label><select id="scanCamera" onchange="startQR(this.value)" disabled><option>Starting camera…</option></select><div id="reader" style="margin-top:10px"></div><p id="scanStatus" class="muted" role="status" aria-live="polite">Starting camera…</p><div id="scanZoomBox" hidden><label for="scanZoom">Zoom — keep the whole barcode visible</label><input id="scanZoom" type="range" onchange="setScanZoom(this.value)"></div><button id="scanFocus" class="secondary" hidden onclick="focusScan()">Refocus</button><div class="row" style="margin-top:10px"><button class="secondary" onclick="closeScan()">Cancel</button><button class="secondary" onclick="barcodeManual()">Enter Barcode Manually</button></div><p class="muted">Nutrition comes from Open Food Facts; check it against the package label.</p></div></div>`;
 startQR("",epoch);
}
function startQR(cameraId="",epoch=++scanEpoch){
 scanQueue=scanQueue.catch(()=>{}).then(async()=>{
  await stopCamera();if(epoch!==scanEpoch||!scanElement("reader"))return;
  const picker=scanElement("scanCamera");picker.disabled=true;
  scanElement("scanFocus").hidden=true;scanElement("scanZoomBox").hidden=true;
  scanMessage("Starting camera…");
  try{
   for(let i=0;typeof Html5Qrcode==="undefined"&&i<20;i++){await new Promise(resolve=>setTimeout(resolve,250));if(epoch!==scanEpoch)return}
   if(typeof Html5Qrcode==="undefined")throw Error("Scanner unavailable");
   const cameras=await Html5Qrcode.getCameras();if(epoch!==scanEpoch)return;
   if(!cameras.length)throw Error("No camera");
   picker.innerHTML=cameras.map((c,i)=>`<option value="${esc(c.id)}">${esc(c.label||`Camera ${i+1}`)}</option>`).join("");
   const chosen=cameraId||preferredCamera(cameras)?.id;
   const target=chosen?{deviceId:{exact:chosen}}:{facingMode:{ideal:"environment"}};
   const scanner=new Html5Qrcode("reader");qr=scanner;let decoded=false;
   await scanner.start(target,{fps:10,disableFlip:true,videoConstraints:{...target,width:{ideal:1920},height:{ideal:1080}},qrbox:(w,h)=>({width:Math.min(360,Math.floor(w*.9)),height:Math.min(150,Math.floor(h*.65))})},code=>{
    if(decoded||epoch!==scanEpoch)return;decoded=true;
    finishScan(code);
   });
   if(epoch!==scanEpoch){await stopCamera();return}
   picker.value=scanner.getRunningTrackSettings?.().deviceId||chosen||cameras[0].id;picker.disabled=cameras.length<2;
   const caps=scanner.getRunningTrackCapabilities?.()||{};
   if(caps.focusMode?.includes("continuous")){
    try{await scanner.applyVideoConstraints({advanced:[{focusMode:"continuous"}]});scanElement("scanFocus").hidden=false}catch(e){}
   }
   if(epoch!==scanEpoch)return;
   if(caps.zoom&&caps.zoom.max>caps.zoom.min){
    const z=scanElement("scanZoom"),range=caps.zoom;
    z.min=range.min;z.max=Math.min(range.max,Math.max(range.min,4));z.step=range.step||.1;
    // Start 50% closer when supported; stay within the camera's zoom range.
    const step=range.step||.1;
    const preferred=Math.min(range.max,Math.max(range.min,1.5));
    const initial=Math.min(range.max,Number((range.min+Math.ceil((preferred-range.min)/step-1e-9)*step).toFixed(6)));
    try{await scanner.applyVideoConstraints({advanced:[{zoom:initial}]})}catch(e){}
    if(epoch!==scanEpoch)return;
    z.value=scanner.getRunningTrackSettings?.().zoom??range.min;scanElement("scanZoomBox").hidden=false;
   }
   scanMessage("Scanning automatically… Hold the entire barcode steady. Adjust zoom if needed.");
  }catch(e){await stopCamera();if(epoch===scanEpoch){picker.disabled=picker.options.length<2;scanMessage("Camera could not start. Allow camera access, choose another camera, or enter the barcode manually.")}}
 });return scanQueue;
}
async function focusScan(){const scanner=qr,epoch=scanEpoch;if(!scanner)return;try{await scanner.applyVideoConstraints({advanced:[{focusMode:"continuous"}]});if(epoch===scanEpoch)scanMessage("Continuous focus enabled. Hold the barcode steady.")}catch(e){if(epoch===scanEpoch)scanMessage("Focus is controlled by your phone. Move back or choose another camera.")}}
async function setScanZoom(value){const scanner=qr,epoch=scanEpoch;if(!scanner)return;try{await scanner.applyVideoConstraints({advanced:[{zoom:Number(value)}]})}catch(e){if(epoch===scanEpoch)scanMessage("Zoom is unavailable on this camera. Move the phone to adjust the view.")}}
async function closeScan(goBack=true){++scanEpoch;scanQueue=scanQueue.catch(()=>{}).then(stopCamera);await scanQueue;if(goBack)show("food")}
async function finishScan(code){await closeScan(false);await lookup(code)}
async function barcodeManual(){const code=prompt("Enter UPC/EAN barcode:");if(code&&code.trim())await finishScan(code.trim())}
async function lookup(code){try{let j=await req("barcode.php?barcode="+encodeURIComponent(code));if(j)confirmProduct(j.product)}catch(e){alert(e.message)}}
function confirmProduct(p){app.innerHTML=`<div class="card"><h2>Product Found</h2><div class="row">${p.image_url?`<img class="productimg" src="${esc(p.image_url)}">`:""}<div><b>${esc(p.name)}</b><div class="muted">${esc(p.brand||"")}</div><span class="badge">Barcode ${esc(p.barcode)}</span></div></div><div class="notice">Review nutrition against the package before saving.</div><label>Meal</label><select id="pm">${["breakfast","lunch","dinner","snack"].map(x=>`<option>${x}</option>`).join("")}</select><div class="two"><div><label>Servings</label><input id="ps" type="number" step=".1" value="1"></div><div><label>Serving size</label><input id="pss" value="${esc(p.serving_size||"")}"></div><div><label>Calories</label><input id="pc" type="number" value="${p.calories}"></div><div><label>Protein g</label><input id="pp" type="number" value="${p.protein_g}"></div><div><label>Carbs g</label><input id="pcb" type="number" value="${p.carbs_g}"></div><div><label>Fat g</label><input id="pf" type="number" value="${p.fat_g}"></div><div><label>Fiber g</label><input id="pfi" type="number" value="${p.fiber_g}"></div></div><button onclick='saveScan(${JSON.stringify(p).replace(/</g,"\\u003c")})'>Add to Food Log</button> <button class="secondary" onclick="show('food')">Cancel</button></div>`}
async function saveScan(p){await req("api.php",{method:"POST",body:JSON.stringify({action:"food_add",food_date:today(),meal_type:pm.value,food_name:p.name,brand:p.brand,servings:+ps.value||1,calories:+pc.value||0,protein_g:+pp.value||0,carbs_g:+pcb.value||0,fat_g:+pf.value||0,fiber_g:+pfi.value||0,barcode:p.barcode,serving_size:pss.value,source:"open_food_facts",notes:p.source_url})});await load();show("food")}
function recipes(){app.innerHTML=`<div class="card"><h2>Recipe Database</h2><p class="muted">Starter recipes are shared. Recipes you add are shared with your family.</p><button onclick="recipeForm()">＋ Add Recipe</button> <button onclick="webImport()">🌐 Import Website</button> <button onclick="notesImport()">📱 Import iPhone Notes</button></div><div class="card"><input id="rs" placeholder="Search recipes…" oninput="listR()"><div id="rl"></div></div>`;listR()}
function listR(){let q=(rs.value||"").toLowerCase();rl.innerHTML=s.recipes.filter(r=>(r.recipe_name+" "+(r.ingredients||[]).join(" ")).toLowerCase().includes(q)).map(r=>`<div class="recipe"><div class="row" style="justify-content:space-between"><b>${esc(r.recipe_name)}</b>${r.user_id?`<button class="danger" onclick="delR(${r.id})">Delete</button>`:""}</div><div class="muted">${r.calories_per_serving} cal • ${r.protein_per_serving}g protein • ${r.carbs_per_serving}g carbs • ${r.fat_per_serving}g fat</div><details><summary>Ingredients & directions</summary><ul>${(r.ingredients||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p>${esc(r.instructions||"")}</p></details><button class="secondary" onclick="logRecipe(${r.id})">＋ Log as Food</button></div>`).join("")}
function recipeForm(p={}){app.innerHTML=`<div class="card"><h2>Add Recipe</h2><label>Name</label><input id="rn" value="${esc(p.name||"")}"><div class="two"><div><label>Servings</label><input id="rsv" type="number" value="${p.servings||1}"></div><div><label>Calories</label><input id="rc" type="number" value="${p.cal||0}"></div><div><label>Protein</label><input id="rp" type="number" value="${p.pro||0}"></div><div><label>Carbs</label><input id="rcc" type="number" value="${p.carb||0}"></div><div><label>Fat</label><input id="rf" type="number" value="${p.fat||0}"></div><div><label>Fiber</label><input id="rfi" type="number" value="${p.fiber||0}"></div></div><label>Ingredients — one per line</label><textarea id="ri" rows="8">${esc((p.ingredients||[]).join("\n"))}</textarea><label>Directions</label><textarea id="rd" rows="6">${esc(p.directions||"")}</textarea><button onclick="saveRcp()">Save Recipe</button> <button class="secondary" onclick="show('recipes')">Cancel</button></div>`}
async function saveRcp(){if(!rn.value.trim())return alert("Enter a recipe name.");await req("api.php",{method:"POST",body:JSON.stringify({action:"recipe_add",recipe_name:rn.value.trim(),servings:+rsv.value||1,calories_per_serving:+rc.value||0,protein_per_serving:+rp.value||0,carbs_per_serving:+rcc.value||0,fat_per_serving:+rf.value||0,fiber_per_serving:+rfi.value||0,ingredients:ri.value.split(/\n/).filter(Boolean),instructions:rd.value})});await load();show("recipes")}
async function delR(id){if(confirm("Delete this recipe?")){await req("api.php",{method:"POST",body:JSON.stringify({action:"recipe_delete",id})});await load();show("recipes")}}
function webImport(){let u=prompt("Paste the recipe website URL:");if(!u)return;alert("Website recipe extraction is not enabled yet. Open the recipe page, copy the recipe text, then paste it into the iPhone Notes import box.");notesImport()}
function notesImport(){let t=prompt("Paste recipe text from iPhone Notes:");if(!t)return;let l=t.split(/\n/).map(x=>x.trim()).filter(Boolean),n=l[0],i=[],d=[],m="";l.slice(1).forEach(x=>{if(/^(ingredients?|what you need)/i.test(x)){m="i";return}if(/^(directions?|instructions?|method|steps?)/i.test(x)){m="d";return}m==="i"?i.push(x):m==="d"&&d.push(x)});if(!i.length)i=l.slice(1);recipeForm({name:n,ingredients:i,directions:d.join(" ")})}
function logRecipe(id){let r=s.recipes.find(x=>x.id==id);manual({name:r.recipe_name,calories:r.calories_per_serving,protein_g:r.protein_per_serving,carbs_g:r.carbs_per_serving,fat_g:r.fat_per_serving,fiber_g:r.fiber_per_serving})}
function plan(){let ds=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)});app.innerHTML=`<div class="card"><h2>Weekly Meal Plan</h2><button onclick="genWeek()">Generate / Regenerate Week</button></div>`+ds.map(d=>`<div class="card"><h3>${new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</h3>${(s.plans[d]||[]).map(r=>`<button class="recipe meal-recipe" onclick="openPlanRecipe(${Number(r.recipe_id)})"><b>${esc(r.recipe_name)}</b><span class="muted">${r.calories_per_serving} cal • ${r.protein_per_serving}g protein</span><span class="recipe-link">View recipe →</span></button>`).join("")||"<p class='muted'>No meals planned.</p>"}</div>`).join("")}
function openPlanRecipe(id){
 const recipe=s.recipes.find(r=>Number(r.id)===Number(id));
 header();nav("plan");
 if(!recipe){app.innerHTML=`<div class="card"><h2>Recipe unavailable</h2><p>This recipe may have been removed. Refresh your recipes or regenerate the meal plan.</p><button onclick="show('plan')">Back to Meal Plan</button></div>`;return}
 app.innerHTML=`<div class="card"><button class="secondary" onclick="show('plan')">← Back to Meal Plan</button><h2 style="margin-top:16px">${esc(recipe.recipe_name)}</h2><p class="muted">Makes ${esc(recipe.servings||1)} serving(s) • Per serving: ${esc(recipe.calories_per_serving||0)} cal • ${esc(recipe.protein_per_serving||0)}g protein • ${esc(recipe.carbs_per_serving||0)}g carbs • ${esc(recipe.fat_per_serving||0)}g fat</p><h3>Ingredients</h3>${recipe.ingredients?.length?`<ul>${recipe.ingredients.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"<p>No ingredients saved.</p>"}<h3>Directions</h3><p style="white-space:pre-wrap">${esc(recipe.instructions||"No directions saved.")}</p><button onclick="logRecipe(${Number(recipe.id)})">＋ Log as Food</button></div>`;
}
async function genWeek(){let cats={Breakfast:[],Lunch:[],Dinner:[],Snack:[]};s.recipes.forEach(r=>{let n=r.recipe_name.toLowerCase(),c=/breakfast|oats|egg|yogurt/.test(n)?"Breakfast":/snack|shake|cottage/.test(n)?"Snack":/pasta|chili|buffalo|taco/.test(n)?"Dinner":"Lunch";cats[c].push(r)});for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()+i),k=d.toISOString().slice(0,10),ids=[];Object.keys(cats).forEach((c,j)=>{if(cats[c].length)ids.push(cats[c][(i+j)%cats[c].length].id)});await req("api.php",{method:"POST",body:JSON.stringify({action:"plan_save",plan_date:k,recipe_ids:ids})})}await load();show("plan")}

function family(){let f=s.family||[],i=s.family_info;app.innerHTML=`<div class="card"><h2>FitFuel Family</h2>${i?`<div class="notice"><b>${esc(i.name)}</b><br>Invite code: <b>${esc(i.invite_code)}</b><br><span class="muted">Give this code to another FitFuel account.</span></div>`:""}${f.map(x=>`<div class="recipe"><b>${esc(x.first_name)} ${esc(x.last_name||"")}</b> <span class="badge">${x.member_role}</span><div class="muted">${esc(x.email)}</div></div>`).join("")}<button onclick="join()">＋ Join Another Family</button></div>`}
async function join(){let c=prompt("Enter family invite code:");if(!c)return;try{await req("api.php",{method:"POST",body:JSON.stringify({action:"join_family",invite_code:c})});await load();show("family")}catch(e){alert(e.message)}}
function progress(){app.innerHTML=`<div class="card"><h2>Progress</h2><form onsubmit="addProg(event)"><label>Weight (lb)</label><input id="pw" type="number" step=".1" required><div class="two"><div><label>Body fat %</label><input id="pbf" type="number" step=".1"></div><div><label>Waist (in)</label><input id="pwa" type="number" step=".1"></div></div><button>Add Check-in</button></form></div><div class="card"><h2>Weight History</h2>${s.progress.map(x=>`<div class="row" style="justify-content:space-between"><span>${x.log_date}</span><b>${x.weight||"—"} lb</b></div>`).join("")||"<p class='muted'>No check-ins yet.</p>"}</div><div class="card"><h2>Workout Log</h2><button onclick="workoutForm()">＋ Log Workout</button>${s.workouts.map(x=>`<div class="recipe"><b>${esc(x.workout_name)}</b><div class="muted">${x.workout_date} • ${x.duration_minutes||0} min</div></div>`).join("")}</div>`}

function legacyWorkoutForm(){app.innerHTML=`<div class="card"><h2>Log Workout</h2><label>Date</label><input id="wd" type="date" value="${today()}"><label>Workout name</label><input id="wn" placeholder="LIIFT4 — Chest & Triceps"><label>Duration (minutes)</label><input id="wm" type="number" value="30"><label>Notes</label><textarea id="wno"></textarea><button onclick="saveWorkout()">Save Workout</button> <button class="secondary" onclick="show('progress')">Cancel</button></div>`}

function settingOption(value,label,current){return `<option value="${value}" ${current===value?"selected":""}>${label}</option>`}
function settings(){let p=s.profile||{},activity=({sedentary:"sedentary",light:"light",lightly_active:"light",moderate:"moderate",moderately_active:"moderate",active:"active",very_active:"active",extra_active:"extra_active"}[p.activity_level]||"sedentary"),goal=({fat_loss:"fat_loss",weight_loss:"fat_loss",lose_weight:"fat_loss",maintenance:"maintenance",maintain_weight:"maintenance",muscle_gain:"muscle_gain",gain_muscle:"muscle_gain"}[p.fitness_goal]||"maintenance");app.innerHTML=`<div class="card"><h2>Health & Nutrition Calculators</h2><p class="muted">For adults 18+. Not intended for pregnancy or breastfeeding. Estimates use your current body weight and the Mifflin–St Jeor equation.</p><div class="two"><div><label>Sex used by BMR formula</label><select id="calcSex"><option value="">Select</option><option value="male">Male</option><option value="female">Female</option></select></div><div><label>Date of birth</label><input id="sdob" type="date" value="${esc(p.date_of_birth||"")}"></div><div><label>Height (inches)</label><input id="sh" type="number" min="36" max="96" step=".1" value="${p.height_inches||""}"></div><div><label>Current weight (lb)</label><input id="swt" type="number" min="50" max="1000" step=".1" value="${p.current_weight||""}"></div><div><label>Activity for this calculation</label><select id="sa">${settingOption("sedentary","Sedentary — little exercise",activity)}${settingOption("light","Light — 1–3 days/week",activity)}${settingOption("moderate","Moderate — 3–5 days/week",activity)}${settingOption("active","Very active — 6–7 days/week",activity)}${settingOption("extra_active","Extra active — hard training/physical job",activity)}</select></div><div><label>Goal for this calculation</label><select id="sgoal">${settingOption("fat_loss","Lose about 1 lb/week",goal)}${settingOption("fat_loss_fast","Lose up to 2 lb/week",goal)}${settingOption("maintenance","Maintain weight",goal)}${settingOption("muscle_gain","Build muscle",goal)}</select></div></div><button onclick="calculateTargets()">Calculate & Fill Targets</button><p id="calcError" class="notice" role="alert" style="display:none"></p><div id="calcResults" class="grid" style="margin-top:12px" aria-live="polite"></div><p class="muted">These are estimates. Review the targets below, adjust them if desired, then save your profile.</p><details><summary>How the estimates work</summary><p class="muted">BMI is a screening measure, not a diagnosis; it does not distinguish fat from muscle. BMR estimates calories at rest; TDEE multiplies BMR by activity (1.2–1.9). Fat-loss goals subtract 500 or 1,000 calories and muscle gain adds 250. As a conservative app rule, reductions stop at estimated BMR; this is not a personal minimum-intake prescription and actual weight change varies.</p><p class="muted">Macro starting targets: protein 0.7 g/lb for maintenance or 0.8 g/lb for fat loss and muscle gain; fat about 25% of calories; carbohydrates use the remaining calories. You can edit all targets below.</p><p class="muted"><a href="https://pubmed.ncbi.nlm.nih.gov/2305711/" target="_blank" rel="noopener">BMR equation</a> · <a href="https://www.cdc.gov/bmi/adult-calculator/bmi-categories.html" target="_blank" rel="noopener">BMI categories</a> · <a href="https://www.nationalacademies.org/news/report-offers-new-eating-and-physical-activity-targets-to-reduce-chronic-disease-risk" target="_blank" rel="noopener">Fiber targets</a></p></details></div><div class="card"><h2>Profile & Daily Targets</h2><div class="two"><div><label>Calories</label><input id="sc" type="number" min="0" value="${p.daily_calorie_goal||""}"></div><div><label>Protein (g)</label><input id="sp" type="number" min="0" value="${p.daily_protein_goal||""}"></div><div><label>Carbs (g)</label><input id="scc" type="number" min="0" value="${p.daily_carbs_goal||""}"></div><div><label>Fat (g)</label><input id="sf" type="number" min="0" value="${p.daily_fat_goal||""}"></div><div><label>Fiber (g)</label><input id="sfi" type="number" min="0" value="${p.daily_fiber_goal||""}"></div><div><label>Goal weight (lb)</label><input id="sgw" type="number" min="50" max="1000" step=".1" value="${p.goal_weight||""}"></div></div><button onclick="saveSettings()">Save Profile Settings</button><p id="settingsMessage" class="muted" role="status"></p></div><div class="card"><h2>Account</h2><p class="muted">${esc(s.user.email)}</p><button class="danger" onclick="logout()">Log Out</button></div>`}
function calculateTargets(){
 const sex=calcSex.value,dob=new Date(sdob.value+"T12:00:00"),height=Number(sh.value),weight=Number(swt.value),activity=sa.value,goal=sgoal.value,error=calcError;
 error.style.display="none";calcResults.innerHTML="";
 if(!["male","female"].includes(sex)){error.textContent="Select the sex used by the BMR formula.";error.style.display="block";return}
 if(!sdob.value||Number.isNaN(dob.getTime())||dob>new Date()){error.textContent="Enter a valid date of birth.";error.style.display="block";return}
 let age=new Date().getFullYear()-dob.getFullYear(),now=new Date();if(now.getMonth()<dob.getMonth()||(now.getMonth()===dob.getMonth()&&now.getDate()<dob.getDate()))age--;
 if(age>120){error.textContent="Check your date of birth.";error.style.display="block";return}
 if(age<18){error.textContent="These formulas are for adults age 18 and older.";error.style.display="block";return}
 if(!Number.isFinite(height)||height<36||height>96||!Number.isFinite(weight)||weight<50||weight>1000){error.textContent="Enter a valid height and current weight.";error.style.display="block";return}
 const kg=weight*.45359237,cm=height*2.54,bmi=weight*703/(height*height);
 const bmr=Math.round(10*kg+6.25*cm-5*age+(sex==="male"?5:-161));
 const factors={sedentary:1.2,light:1.375,moderate:1.55,active:1.725,extra_active:1.9};
 if(!Object.prototype.hasOwnProperty.call(factors,activity)){error.textContent="Select an activity level.";error.style.display="block";return}
 const tdee=Math.round(bmr*factors[activity]);
 const adjustments={fat_loss:-500,fat_loss_fast:-1000,maintenance:0,muscle_gain:250};
 if(!Object.prototype.hasOwnProperty.call(adjustments,goal)){error.textContent="Select a goal.";error.style.display="block";return}
 const calorieTarget=Math.ceil(Math.max(bmr,tdee+adjustments[goal])/10)*10;
 const protein=Math.round(weight*(goal==="maintenance"?.7:.8));
 const fat=Math.round(calorieTarget*.25/9);
 const carbs=Math.max(0,Math.round((calorieTarget-protein*4-fat*9)/4));
 const fiber=age>50?(sex==="male"?30:21):(sex==="male"?38:25);
 const bmiRange=age<20?"Use BMI-for-age guidance under age 20":bmi<18.5?"Below healthy adult range":bmi<25?"Healthy adult range":bmi<30?"Above healthy adult range":"Well above healthy adult range";
 sc.value=calorieTarget;sp.value=protein;scc.value=carbs;sf.value=fat;sfi.value=fiber;
 calcResults.innerHTML=`<div class="stat">BMI<b>${bmi.toFixed(1)}</b><small>${bmiRange}</small></div><div class="stat">BMR<b>${bmr}</b><small>calories/day at rest</small></div><div class="stat">TDEE<b>${tdee}</b><small>estimated calories/day</small></div><div class="stat">Calorie target<b>${calorieTarget}</b><small>based on selected goal</small></div><div class="stat">Protein<b>${protein}g</b><small>daily target</small></div><div class="stat">Carbs / Fat<b>${carbs}g / ${fat}g</b><small>daily targets</small></div>`;
}
async function saveSettings(){settingsMessage.textContent="Saving…";try{await req("profile.php",{method:"POST",body:JSON.stringify({date_of_birth:sdob.value||null,height_inches:+sh.value||null,current_weight:+swt.value||null,goal_weight:+sgw.value||null,activity_level:s.profile.activity_level??null,fitness_goal:s.profile.fitness_goal??null,daily_calorie_goal:+sc.value||null,daily_protein_goal:+sp.value||null,daily_carbs_goal:+scc.value||null,daily_fat_goal:+sf.value||null,daily_fiber_goal:+sfi.value||null})});await load();show("settings")}catch(e){settingsMessage.textContent=e.message}}

async function doLogin(){try{await req("login.php",{method:"POST",body:JSON.stringify({email:le.value,password:lp.value})});await load();show("home")}catch(e){lm.style.display="block";lm.textContent=e.message}}
