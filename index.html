<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#111827"><title>FitFuel Family</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:18px 15px;position:sticky;top:0;z-index:20}h1{margin:0 0 4px;font-size:24px}.sub{font-size:13px;opacity:.75}nav{position:sticky;top:72px;z-index:19;background:#fff;padding:8px;display:flex;gap:7px;overflow:auto;border-bottom:1px solid #ddd}nav button{white-space:nowrap;background:#edf0f3;color:#17202a}nav button.active{background:#111827;color:#fff}main{max-width:900px;margin:auto;padding:14px 14px 80px}.card{background:#fff;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 1px 4px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{background:#f5f7fa;border-radius:10px;padding:12px}.stat b{display:block;font-size:20px}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px}button{border:0;border-radius:9px;padding:10px 13px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#e9edf2;color:#17202a}button.danger{background:#dc2626}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd3da;border-radius:9px;font:inherit;background:#fff}.recipe,.fooditem{border:1px solid #e1e5e9;border-radius:11px;padding:12px;margin:9px 0}.muted{color:#68737d;font-size:13px}.badge{display:inline-block;padding:4px 7px;border-radius:12px;background:#eaf2ff;color:#1d4ed8;font-size:11px;font-weight:700}.notice{background:#fff8e6;border:1px solid #f2d38b;padding:10px;border-radius:10px}.modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modalbox{background:#fff;border-radius:15px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:15px}.productimg{width:70px;height:70px;object-fit:contain;background:#f5f5f5;border-radius:8px}@media(max-width:600px){.two{grid-template-columns:1fr}}
</style><script src="https://unpkg.com/html5-qrcode" defer></script></head><body>
<header><h1>FitFuel Family</h1><div class="sub" id="sub"></div></header><nav id="nav"></nav><main id="app"></main>
<script>
const API="./API/",today=()=>new Date().toISOString().slice(0,10),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));let s={authenticated:false,user:null,profile:{},recipes:[],food:[],water:0,progress:[],workouts:[],plans:{},family:[],family_info:null};
async function req(path,opt={}){let r=await fetch(API+path,{credentials:"include",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}}),j=await r.json().catch(()=>({success:false,message:"Server error."}));if(r.status===401){loginPage();return null}if(!r.ok||j.success===false)throw Error(j.message||"Request failed.");return j}
async function load(){let j=await req("api.php?action=bootstrap&date="+today());if(j)s={...s,...j,authenticated:true};return j}
function nav(a){document.getElementById("nav").innerHTML=["home:Today","food:Food Log","recipes:Recipes","plan:Meal Plan","grocery:Groceries","family:Family","progress:Progress","settings:Settings"].map(x=>{let[q,w]=x.split(":");return`<button class="${a===q?"active":""}" onclick="show('${q}')">${w}</button>`}).join("")}
function header(){let p=s.profile||{},u=s.user;document.getElementById("sub").textContent=u?`${u.first_name} • ${p.daily_calorie_goal||0} cal • ${p.daily_protein_goal||0}g protein/day`:"Secure family account"}
async function show(a){header();nav(a);if(a==="home")home();if(a==="food")food();if(a==="recipes")recipes();if(a==="plan")plan();if(a==="grocery")grocery();if(a==="family")family();if(a==="progress")progress();if(a==="settings")settings()}
function totals(){return s.food.reduce((z,x)=>({cal:z.cal+Number(x.calories||0)*Number(x.servings||1),pro:z.pro+Number(x.protein_g||0)*Number(x.servings||1)}),{cal:0,pro:0})}
function home(){let t=totals(),p=s.profile;app.innerHTML=`<div class="card"><h2>Today</h2><div class="grid"><div class="stat">Calories<b>${t.cal.toFixed(0)}</b><small>/ ${p.daily_calorie_goal||0}</small></div><div class="stat">Protein<b>${t.pro.toFixed(1)}g</b><small>/ ${p.daily_protein_goal||0}g</small></div><div class="stat">Water<b>${s.water.toFixed(0)} oz</b></div></div></div><div class="card"><h2>Quick Add</h2><div class="row"><button onclick="scan()">📷 Scan Barcode</button><button onclick="manual()">＋ Add Food</button><button onclick="show('recipes')">🍽 Recipes</button></div></div><div class="card"><h2>Today's Food</h2>${s.food.length?s.food.map(fi).join(""):"<p class='muted'>Nothing logged yet.</p>"}</div><div class="card"><h2>Water</h2><div class="row"><button onclick="water(8)">+8 oz</button><button onclick="water(16)">+16 oz</button><button onclick="water(24)">+24 oz</button></div></div><div class="card"><h2>Workout</h2><button onclick="workoutForm()">＋ Log Workout</button></div>`}
function fi(x){return`<div class="fooditem"><div class="row" style="justify-content:space-between"><div><b>${esc(x.food_name)}</b>${x.brand?` <span class="badge">${esc(x.brand)}</span>`:""}<div class="muted">${x.meal_type} • ${x.servings} serving(s) • ${(Number(x.calories)*Number(x.servings)).toFixed(0)} cal • ${(Number(x.protein_g)*Number(x.servings)).toFixed(1)}g protein</div></div><button class="danger" onclick="delFood(${x.id})">Delete</button></div></div>`}
async function food(){await load();header();nav("food");app.innerHTML=`<div class="card"><h2>Food Log</h2><div class="row"><button onclick="scan()">📷 Scan Barcode</button><button onclick="manual()">＋ Add Food</button></div></div><div class="card">${s.food.length?s.food.map(fi).join(""):"<p class='muted'>No food logged today.</p>"}</div>`}
async function water(n){await req("api.php",{method:"POST",body:JSON.stringify({action:"water_add",ounces:n,log_date:today()})});await load();show("home")}
async function delFood(id){if(confirm("Delete this food entry?")){await req("api.php",{method:"POST",body:JSON.stringify({action:"food_delete",id}));await load();show("food")}}
function manual(p={}){app.innerHTML=`<div class="card"><h2>Add Food</h2><label>Food name</label><input id="fn" value="${esc(p.name||"")}"><div class="two"><div><label>Meal</label><select id="fm">${["breakfast","lunch","dinner","snack"].map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Servings</label><input id="fs" type="number" step=".1" value="${p.servings||1}"></div><div><label>Calories / serving</label><input id="fc" type="number" value="${p.calories||0}"></div><div><label>Protein g / serving</label><input id="fp" type="number" value="${p.protein_g||0}"></div><div><label>Carbs g / serving</label><input id="fcb" type="number" value="${p.carbs_g||0}"></div><div><label>Fat g / serving</label><input id="ff" type="number" value="${p.fat_g||0}"></div><div><label>Fiber g / serving</label><input id="ffi" type="number" value="${p.fiber_g||0}"></div><div><label>Brand</label><input id="fbr" value="${esc(p.brand||"")}"></div></div><label>Serving size</label><input id="fss" value="${esc(p.serving_size||"")}"><label>Notes</label><textarea id="fno"></textarea><div class="row"><button onclick="saveFood()">Save Food</button><button class="secondary" onclick="show('food')">Cancel</button></div></div>`}
async function saveFood(){if(!fn.value.trim())return alert("Enter a food name.");await req("api.php",{method:"POST",body:JSON.stringify({action:"food_add",food_date:today(),meal_type:fm.value,food_name:fn.value.trim(),servings:+fs.value||1,calories:+fc.value||0,protein_g:+fp.value||0,carbs_g:+fcb.value||0,fat_g:+ff.value||0,fiber_g:+ffi.value||0,brand:fbr.value,serving_size:fss.value,notes:fno.value,source:"manual"})});await load();show("food")}
let qr=null;
function scan(){app.innerHTML=`<div class="modal"><div class="modalbox"><h2>Scan Food Barcode</h2><p class="muted">Allow camera access and point it at the UPC/EAN barcode.</p><div id="reader"></div><div class="row" style="margin-top:10px"><button class="secondary" onclick="closeScan()">Cancel</button><button class="secondary" onclick="barcodeManual()">Enter Barcode Manually</button></div><p class="muted">Nutrition comes from Open Food Facts; check it against the package label.</p></div></div>`;startQR()}
async function startQR(){if(typeof Html5Qrcode==="undefined"){setTimeout(startQR,400);return}try{qr=new Html5Qrcode("reader");let c=await Html5Qrcode.getCameras();if(!c.length)throw Error("No camera");await qr.start(c[c.length-1].id,{fps:10,qrbox:{width:280,height:120}},async code=>{await qr.stop();qr.clear();qr=null;lookup(code)})}catch(e){reader.innerHTML="<div class='notice'>Camera scanner could not start. Check browser camera permission or enter the barcode manually.</div>"}}
function closeScan(){if(qr){qr.stop().catch(()=>{}).finally(()=>{try{qr.clear()}catch(e){}});qr=null}show("food")}
function barcodeManual(){let b=prompt("Enter UPC/EAN barcode:");if(b){closeScan();lookup(b)}}
async function lookup(code){try{let j=await req("barcode.php?barcode="+encodeURIComponent(code));if(j)confirmProduct(j.product)}catch(e){alert(e.message)}}
function confirmProduct(p){app.innerHTML=`<div class="card"><h2>Product Found</h2><div class="row">${p.image_url?`<img class="productimg" src="${esc(p.image_url)}">`:""}<div><b>${esc(p.name)}</b><div class="muted">${esc(p.brand||"")}</div><span class="badge">Barcode ${esc(p.barcode)}</span></div></div><div class="notice">Review nutrition against the package before saving.</div><label>Meal</label><select id="pm">${["breakfast","lunch","dinner","snack"].map(x=>`<option>${x}</option>`).join("")}</select><div class="two"><div><label>Servings</label><input id="ps" type="number" step=".1" value="1"></div><div><label>Serving size</label><input id="pss" value="${esc(p.serving_size||"")}"></div><div><label>Calories</label><input id="pc" type="number" value="${p.calories}"></div><div><label>Protein g</label><input id="pp" type="number" value="${p.protein_g}"></div><div><label>Carbs g</label><input id="pcb" type="number" value="${p.carbs_g}"></div><div><label>Fat g</label><input id="pf" type="number" value="${p.fat_g}"></div><div><label>Fiber g</label><input id="pfi" type="number" value="${p.fiber_g}"></div></div><button onclick='saveScan(${JSON.stringify(p).replace(/</g,"\\u003c")})'>Add to Food Log</button> <button class="secondary" onclick="show('food')">Cancel</button></div>`}
async function saveScan(p){await req("api.php",{method:"POST",body:JSON.stringify({action:"food_add",food_date:today(),meal_type:pm.value,food_name:p.name,brand:p.brand,servings:+ps.value||1,calories:+pc.value||0,protein_g:+pp.value||0,carbs_g:+pcb.value||0,fat_g:+pf.value||0,fiber_g:+pfi.value||0,barcode:p.barcode,serving_size:pss.value,source:"open_food_facts",notes:p.source_url})});await load();show("food")}
function recipes(){app.innerHTML=`<div class="card"><h2>Recipe Database</h2><p class="muted">Starter recipes are shared. Recipes you add are shared with your family.</p><button onclick="recipeForm()">＋ Add Recipe</button> <button onclick="notesImport()">📱 Import iPhone Notes</button></div><div class="card"><input id="rs" placeholder="Search recipes…" oninput="listR()"><div id="rl"></div></div>`;listR()}
function listR(){let q=(rs.value||"").toLowerCase();rl.innerHTML=s.recipes.filter(r=>(r.recipe_name+" "+(r.ingredients||[]).join(" ")).toLowerCase().includes(q)).map(r=>`<div class="recipe"><div class="row" style="justify-content:space-between"><b>${esc(r.recipe_name)}</b>${r.user_id?`<button class="danger" onclick="delR(${r.id})">Delete</button>`:""}</div><div class="muted">${r.calories_per_serving} cal • ${r.protein_per_serving}g protein • ${r.carbs_per_serving}g carbs • ${r.fat_per_serving}g fat</div><details><summary>Ingredients & directions</summary><ul>${(r.ingredients||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p>${esc(r.instructions||"")}</p></details><button class="secondary" onclick="logRecipe(${r.id})">＋ Log as Food</button></div>`).join("")}
function recipeForm(p={}){app.innerHTML=`<div class="card"><h2>Add Recipe</h2><label>Name</label><input id="rn" value="${esc(p.name||"")}"><div class="two"><div><label>Servings</label><input id="rsv" type="number" value="${p.servings||1}"></div><div><label>Calories</label><input id="rc" type="number" value="${p.cal||0}"></div><div><label>Protein</label><input id="rp" type="number" value="${p.pro||0}"></div><div><label>Carbs</label><input id="rcc" type="number" value="${p.carb||0}"></div><div><label>Fat</label><input id="rf" type="number" value="${p.fat||0}"></div><div><label>Fiber</label><input id="rfi" type="number" value="${p.fiber||0}"></div></div><label>Ingredients — one per line</label><textarea id="ri" rows="8">${esc((p.ingredients||[]).join("\n"))}</textarea><label>Directions</label><textarea id="rd" rows="6">${esc(p.directions||"")}</textarea><button onclick="saveRcp()">Save Recipe</button> <button class="secondary" onclick="show('recipes')">Cancel</button></div>`}
async function saveRcp(){if(!rn.value.trim())return alert("Enter a recipe name.");await req("api.php",{method:"POST",body:JSON.stringify({action:"recipe_add",recipe_name:rn.value.trim(),servings:+rsv.value||1,calories_per_serving:+rc.value||0,protein_per_serving:+rp.value||0,carbs_per_serving:+rcc.value||0,fat_per_serving:+rf.value||0,fiber_per_serving:+rfi.value||0,ingredients:ri.value.split(/\n/).filter(Boolean),instructions:rd.value})});await load();show("recipes")}
async function delR(id){if(confirm("Delete this recipe?")){await req("api.php",{method:"POST",body:JSON.stringify({action:"recipe_delete",id}));await load();show("recipes")}}
function notesImport(){let t=prompt("Paste recipe text from iPhone Notes:");if(!t)return;let l=t.split(/\n/).map(x=>x.trim()).filter(Boolean),n=l[0],i=[],d=[],m="";l.slice(1).forEach(x=>{if(/^(ingredients?|what you need)/i.test(x)){m="i";return}if(/^(directions?|instructions?|method|steps?)/i.test(x)){m="d";return}m==="i"?i.push(x):m==="d"&&d.push(x)});if(!i.length)i=l.slice(1);recipeForm({name:n,ingredients:i,directions:d.join(" ")})}
function logRecipe(id){let r=s.recipes.find(x=>x.id==id);manual({name:r.recipe_name,calories:r.calories_per_serving,protein_g:r.protein_per_serving,carbs_g:r.carbs_per_serving,fat_g:r.fat_per_serving,fiber_g:r.fiber_per_serving})}
function plan(){let ds=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)});app.innerHTML=`<div class="card"><h2>Weekly Meal Plan</h2><button onclick="genWeek()">Generate / Regenerate Week</button></div>`+ds.map(d=>`<div class="card"><h3>${new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</h3>${(s.plans[d]||[]).map(r=>`<div class="recipe"><b>${esc(r.recipe_name)}</b><div class="muted">${r.calories_per_serving} cal • ${r.protein_per_serving}g protein</div></div>`).join("")||"<p class='muted'>No meals planned.</p>"}</div>`).join("")}
async function genWeek(){let cats={Breakfast:[],Lunch:[],Dinner:[],Snack:[]};s.recipes.forEach(r=>{let n=r.recipe_name.toLowerCase(),c=/breakfast|oats|egg|yogurt/.test(n)?"Breakfast":/snack|shake|cottage/.test(n)?"Snack":/pasta|chili|buffalo|taco/.test(n)?"Dinner":"Lunch";cats[c].push(r)});for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()+i),k=d.toISOString().slice(0,10),ids=[];Object.keys(cats).forEach((c,j)=>{if(cats[c].length)ids.push(cats[c][(i+j)%cats[c].length].id)});await req("api.php",{method:"POST",body:JSON.stringify({action:"plan_save",plan_date:k,recipe_ids:ids})})}await load();show("plan")}
function grocery(){let c={};Object.values(s.plans).flat().forEach(r=>(r.ingredients||[]).forEach(x=>c[x]=(c[x]||0)+1));app.innerHTML=`<div class="card"><h2>Grocery List</h2><button onclick="window.print()">🖨 Print / Save PDF</button></div><div class="card">${Object.entries(c).map(([x,n])=>`<div class="check"><input type="checkbox"><span>${esc(x)} ${n>1?`<span class="badge">used ${n}×</span>`:""}</span></div>`).join("")||"<p class='muted'>Generate a meal plan first.</p>"}</div>`}
function family(){let f=s.family||[],i=s.family_info;app.innerHTML=`<div class="card"><h2>FitFuel Family</h2>${i?`<div class="notice"><b>${esc(i.name)}</b><br>Invite code: <b>${esc(i.invite_code)}</b><br><span class="muted">Give this code to another FitFuel account.</span></div>`:""}${f.map(x=>`<div class="recipe"><b>${esc(x.first_name)} ${esc(x.last_name||"")}</b> <span class="badge">${x.member_role}</span><div class="muted">${esc(x.email)}</div></div>`).join("")}<button onclick="join()">＋ Join Another Family</button></div>`}
async function join(){let c=prompt("Enter family invite code:");if(!c)return;try{await req("api.php",{method:"POST",body:JSON.stringify({action:"join_family",invite_code:c})});await load();show("family")}catch(e){alert(e.message)}}
function progress(){app.innerHTML=`<div class="card"><h2>Progress</h2><form onsubmit="addProg(event)"><label>Weight (lb)</label><input id="pw" type="number" step=".1" required><div class="two"><div><label>Body fat %</label><input id="pbf" type="number" step=".1"></div><div><label>Waist (in)</label><input id="pwa" type="number" step=".1"></div></div><button>Add Check-in</button></form></div><div class="card"><h2>Weight History</h2>${s.progress.map(x=>`<div class="row" style="justify-content:space-between"><span>${x.log_date}</span><b>${x.weight||"—"} lb</b></div>`).join("")||"<p class='muted'>No check-ins yet.</p>"}</div><div class="card"><h2>Workout Log</h2><button onclick="workoutForm()">＋ Log Workout</button>${s.workouts.map(x=>`<div class="recipe"><b>${esc(x.workout_name)}</b><div class="muted">${x.workout_date} • ${x.duration_minutes||0} min</div></div>`).join("")}</div>`}
async function addProg(e){e.preventDefault();await req("api.php",{method:"POST",body:JSON.stringify({action:"progress_add",log_date:today(),weight:+pw.value,body_fat_percent:+pbf.value||null,waist_inches:+pwa.value||null})});await load();show("progress")}
function workoutForm(){app.innerHTML=`<div class="card"><h2>Log Workout</h2><label>Date</label><input id="wd" type="date" value="${today()}"><label>Workout name</label><input id="wn" placeholder="LIIFT4 — Chest & Triceps"><label>Duration (minutes)</label><input id="wm" type="number" value="30"><label>Notes</label><textarea id="wno"></textarea><button onclick="saveWorkout()">Save Workout</button> <button class="secondary" onclick="show('progress')">Cancel</button></div>`}
async function saveWorkout(){await req("api.php",{method:"POST",body:JSON.stringify({action:"workout_add",workout_date:wd.value,workout_name:wn.value||"Workout",duration_minutes:+wm.value||0,notes:wno.value,completed:1})});await load();show("progress")}
function settings(){let p=s.profile||{};app.innerHTML=`<div class="card"><h2>Profile Settings</h2><div class="two"><div><label>Calories</label><input id="sc" type="number" value="${p.daily_calorie_goal||""}"></div><div><label>Protein</label><input id="sp" type="number" value="${p.daily_protein_goal||""}"></div><div><label>Carbs</label><input id="scc" type="number" value="${p.daily_carbs_goal||""}"></div><div><label>Fat</label><input id="sf" type="number" value="${p.daily_fat_goal||""}"></div><div><label>Fiber</label><input id="sfi" type="number" value="${p.daily_fiber_goal||""}"></div><div><label>Weight</label><input id="swt" type="number" step=".1" value="${p.current_weight||""}"></div><div><label>Goal Weight</label><input id="sgw" type="number" step=".1" value="${p.goal_weight||""}"></div><div><label>Height (in)</label><input id="sh" type="number" step=".1" value="${p.height_inches||""}"></div></div><button onclick="saveSettings()">Save</button></div><div class="card"><h2>Account</h2><p class="muted">${esc(s.user.email)}</p><button class="danger" onclick="logout()">Log Out</button></div>`}
async function saveSettings(){await req("profile.php",{method:"POST",body:JSON.stringify({daily_calorie_goal:+sc.value||null,daily_protein_goal:+sp.value||null,daily_carbs_goal:+scc.value||null,daily_fat_goal:+sf.value||null,daily_fiber_goal:+sfi.value||null,current_weight:+swt.value||null,goal_weight:+sgw.value||null,height_inches:+sh.value||null})});await load();show("settings")}
async function logout(){await req("logout.php",{method:"POST"});loginPage()}
function loginPage(){nav("");header();app.innerHTML=`<div class="card"><h2>Log In to FitFuel</h2><label>Email</label><input id="le" type="email" autocomplete="email"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><button onclick="doLogin()">Log In</button> <button class="secondary" onclick="registerPage()">Create Account</button><p id="lm" class="notice" style="display:none"></p></div>`}
function registerPage(){app.innerHTML=`<div class="card"><h2>Create FitFuel Account</h2><label>First name</label><input id="rf" autocomplete="given-name"><label>Last name</label><input id="rl" autocomplete="family-name"><label>Email</label><input id="re" type="email" autocomplete="email"><label>Password</label><input id="rpw" type="password" autocomplete="new-password"><small class="muted">At least 8 characters.</small><label>Family name (optional)</label><input id="rfn"><button onclick="doReg()">Create Account</button> <button class="secondary" onclick="loginPage()">Cancel</button><p id="rm" class="notice" style="display:none"></p></div>`}
async function doLogin(){try{await req("login.php",{method:"POST",body:JSON.stringify({email:le.value,password:lp.value})});await load();show("home")}catch(e){lm.style.display="block";lm.textContent=e.message}}
async function doReg(){try{await req("register.php",{method:"POST",body:JSON.stringify({first_name:rf.value,last_name:rl.value,email:re.value,password:rpw.value,family_name:rfn.value})});await load();show("home")}catch(e){rm.style.display="block";rm.textContent=e.message}}
async function init(){try{let j=await req("session.php");if(j&&j.authenticated){await load();show("home")}else loginPage()}catch(e){loginPage()}}init();
</script></body></html>
