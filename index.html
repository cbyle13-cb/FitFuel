<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#111827">
<title>FitFuel Family</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:18px 15px;position:sticky;top:0;z-index:5}h1{margin:0 0 4px;font-size:24px}.sub{font-size:13px;opacity:.75}
nav{position:sticky;top:72px;z-index:4;background:#fff;padding:8px;display:flex;gap:7px;overflow:auto;border-bottom:1px solid #ddd}nav button{white-space:nowrap;background:#edf0f3;color:#17202a}
nav button.active{background:#111827;color:#fff}main{max-width:900px;margin:auto;padding:14px 14px 80px}
.card{background:#fff;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 1px 4px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.stat{background:#f5f7fa;border-radius:10px;padding:12px}.stat b{display:block;font-size:20px}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px}
button{border:0;border-radius:9px;padding:10px 13px;background:#2563eb;color:#fff;font-weight:600}button.secondary{background:#e9edf2;color:#17202a}button.danger{background:#dc2626}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd3da;border-radius:9px;font:inherit;background:#fff}
.recipe{border:1px solid #e1e5e9;border-radius:11px;padding:12px;margin:9px 0}.muted{color:#68737d;font-size:13px}.badge{display:inline-block;padding:4px 7px;border-radius:12px;background:#eaf2ff;color:#1d4ed8;font-size:11px;font-weight:700}
.check{display:flex;gap:8px;align-items:center;padding:8px 0}.check input{width:auto}.notice{background:#fff8e6;border:1px solid #f2d38b;padding:10px;border-radius:10px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
</style></head><body>
<header><h1>FitFuel Family</h1><div class="sub" id="sub"></div></header><nav id="nav"></nav><main id="app"></main>
<script>
const KEY="fitfuel_v5";
const recipes=[
["Greek Yogurt Protein Bowl","Breakfast",330,38,28,7,["Greek yogurt — 1 cup","Protein powder — 1 scoop","Berries — 1/2 cup","Almond butter — 1 tbsp"],"Mix yogurt and protein powder. Top with berries and almond butter."],
["Chicken Fajita Bowl","Lunch",520,52,42,15,["Chicken breast — 6 oz","Rice — 3/4 cup cooked","Bell pepper — 1","Onion — 1/2","Salsa — 2 tbsp"],"Cook chicken with peppers and onion. Serve over rice with salsa."],
["Lean Beef Taco Bowl","Dinner",550,48,40,19,["Lean ground beef — 6 oz","Rice — 1/2 cup cooked","Black beans — 1/2 cup","Lettuce — 1 cup","Salsa — 2 tbsp"],"Brown beef with taco seasoning. Layer with rice, beans, lettuce and salsa."],
["Protein Shake","Snack",240,30,15,5,["Protein powder — 1 scoop","Milk — 1 cup","Ice — 1 cup"],"Blend until smooth."],
["Cottage Cheese Berry Bowl","Snack",280,30,22,8,["Cottage cheese — 1 cup","Berries — 1/2 cup","Chia seeds — 1 tbsp"],"Combine and serve chilled."],
["High-Protein Chicken Pasta","Dinner",570,55,48,15,["Chicken breast — 6 oz","Protein pasta — 2 oz dry","Marinara — 1/2 cup","Parmesan — 1 tbsp"],"Cook pasta. Add chicken and marinara. Finish with parmesan."],
["Turkey Burger Bowl","Lunch",500,48,35,18,["Lean ground turkey — 6 oz","Potato — 8 oz","Lettuce — 1 cup","Pickles — 1/4 cup"],"Cook turkey and serve with roasted potato and salad ingredients."],
["Egg & Turkey Breakfast Bowl","Breakfast",390,37,18,20,["Eggs — 2","Egg whites — 1/2 cup","Turkey sausage — 2 oz","Spinach — 1 cup"],"Cook sausage, then add eggs, whites and spinach."],
["Chicken Caesar Protein Wrap","Lunch",450,45,30,16,["Chicken breast — 5 oz","High-protein tortilla — 1","Romaine — 1 cup","Light Caesar dressing — 2 tbsp","Parmesan — 1 tbsp"],"Fill tortilla with chicken, romaine, dressing and parmesan."],
["Turkey Chili","Dinner",500,50,38,14,["Lean ground turkey — 6 oz","Kidney beans — 1/2 cup","Diced tomatoes — 1 cup","Onion — 1/2","Chili seasoning — 1 tbsp"],"Brown turkey. Add remaining ingredients and simmer 20–30 minutes."],
["Overnight Protein Oats","Breakfast",410,35,45,10,["Oats — 1/2 cup","Greek yogurt — 1/2 cup","Protein powder — 1 scoop","Milk — 1/2 cup","Berries — 1/2 cup"],"Mix and refrigerate overnight."],
["Buffalo Chicken Bowl","Dinner",480,53,30,15,["Chicken breast — 6 oz","Rice — 1/2 cup cooked","Buffalo sauce — 2 tbsp","Greek yogurt — 2 tbsp","Celery — 1/2 cup"],"Toss cooked chicken with buffalo sauce. Serve over rice with yogurt sauce and celery."]
].map((r,i)=>({id:"r"+i,name:r[0],cat:r[1],cal:r[2],pro:r[3],carb:r[4],fat:r[5],servings:1,ingredients:r[6],directions:r[7],source:"Starter"}));
const uid=()=>Math.random().toString(36).slice(2,9), today=()=>new Date().toISOString().slice(0,10);
function fresh(){return{active:"u1",users:[{id:"u1",name:"Me",role:"Owner",cal:2150,pro:200,fat:70,water:96,goalMin:180,goalMax:185},{id:"u2",name:"Wife",role:"Family",cal:1800,pro:140,fat:65,water:80,goalMin:140,goalMax:150}],recipes,plans:{},eaten:{},groceries:{},water:{},weights:{}}}
let s=JSON.parse(localStorage.getItem(KEY)||"null")||fresh(); const save=()=>localStorage.setItem(KEY,JSON.stringify(s));
const me=()=>s.users.find(u=>u.id===s.active)||s.users[0], R=id=>s.recipes.find(r=>r.id===id), esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function show(tab){document.getElementById("sub").textContent=`${me().name} • ${me().cal} cal • ${me().pro}g protein/day`;
document.getElementById("nav").innerHTML=["home:Today","recipes:Recipes","plan:Meal Plan","grocery:Groceries","family:Family","progress:Progress","settings:Settings"].map(x=>{let[a,b]=x.split(":");return`<button class="${tab===a?"active":""}" onclick="show('${a}')">${b}</button>`}).join("");
({home,recipesPage:recipesPage,plan,grocery,family,progress,settings}[tab]||home)()}
function home(){let u=me(),d=today(),ids=s.plans[u.id]?.[d]||[],eat=s.eaten[u.id]?.[d]||[],cal=0,pro=0;eat.forEach(id=>{let r=R(id);if(r){cal+=r.cal;pro+=r.pro}});let w=s.water[u.id]?.[d]||0;
app.innerHTML=`<div class="card"><h2>Today</h2><div class="grid"><div class="stat">Calories<b>${cal}</b><small>/ ${u.cal}</small></div><div class="stat">Protein<b>${pro}g</b><small>/ ${u.pro}g</small></div><div class="stat">Water<b>${w} oz</b><small>/ ${u.water} oz</small></div></div></div>
<div class="card"><h2>Today's Meals</h2>${ids.length?ids.map(id=>{let r=R(id);return`<div class="check"><input type="checkbox" ${eat.includes(id)?"checked":""} onchange="toggleEat('${id}')"><div><b>${esc(r.name)}</b><div class="muted">${r.cal} cal • ${r.pro}g protein</div></div></div>`}).join(""):"<p class='muted'>Generate a meal plan first.</p>"}</div>
<div class="card"><h2>Water</h2><div class="row"><button onclick="water(8)">+8 oz</button><button onclick="water(16)">+16 oz</button><button onclick="water(24)">+24 oz</button><button class="secondary" onclick="water(-8)">−8 oz</button></div></div>
<div class="card"><h2>Workout</h2><p>The existing workout program is preserved. Advanced workout progression is reserved for the next version.</p></div>`}
function toggleEat(id){let u=me(),d=today();s.eaten[u.id]??={};s.eaten[u.id][d]??=[];let a=s.eaten[u.id][d];s.eaten[u.id][d]=a.includes(id)?a.filter(x=>x!==id):[...a,id];save();home()}
function water(n){let u=me(),d=today();s.water[u.id]??={};s.water[u.id][d]=Math.max(0,(s.water[u.id][d]||0)+n);save();home()}
function recipesPage(){app.innerHTML=`<div class="card"><h2>Recipe Database</h2><p class="muted">Shared recipes are available to every family member.</p><div class="row"><button onclick="recipeForm()">＋ Add Recipe</button><button onclick="webImport()">🌐 Import Website</button><button onclick="notesImport()">📱 Import iPhone Notes</button></div><div class="notice" style="margin-top:10px">Website import in this standalone PWA uses a copy/paste fallback because many recipe sites block browser requests. A hosted backend can add true URL extraction later.</div></div><div class="card"><input id="search" placeholder="Search recipes…" oninput="listRecipes()"><div id="rl"></div></div>`;listRecipes()}
function listRecipes(){let q=(document.getElementById("search")?.value||"").toLowerCase(),rs=s.recipes.filter(r=>(r.name+" "+r.cat+" "+r.ingredients.join(" ")).toLowerCase().includes(q));document.getElementById("rl").innerHTML=rs.map(r=>`<div class="recipe"><div class="row" style="justify-content:space-between"><b>${esc(r.name)} <span class="badge">${r.cat}</span></b><button class="danger" onclick="delR('${r.id}')">Delete</button></div><div class="muted">${r.cal} cal • ${r.pro}g protein • ${r.carb}g carbs • ${r.fat}g fat</div><details><summary>Ingredients & directions</summary><ul>${r.ingredients.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p>${esc(r.directions)}</p></details></div>`).join("")}
function recipeForm(p={}){app.innerHTML=`<div class="card"><h2>Add / Import Recipe</h2><label>Name</label><input id="rn" value="${esc(p.name||"")}"><div class="two"><div><label>Category</label><select id="rc">${["Breakfast","Lunch","Dinner","Snack"].map(x=>`<option ${p.cat===x?"selected":""}>${x}</option>`).join("")}</select></div><div><label>Servings</label><input id="rsv" type="number" value="${p.servings||1}"></div></div><div class="two"><div><label>Calories</label><input id="rcl" type="number" value="${p.cal||""}"></div><div><label>Protein (g)</label><input id="rp" type="number" value="${p.pro||""}"></div><div><label>Carbs (g)</label><input id="rcb" type="number" value="${p.carb||""}"></div><div><label>Fat (g)</label><input id="rf" type="number" value="${p.fat||""}"></div></div><label>Ingredients — one per line</label><textarea id="ri" rows="8">${esc((p.ingredients||[]).join("\\n"))}</textarea><label>Directions</label><textarea id="rd" rows="6">${esc(p.directions||"")}</textarea><div class="row"><button onclick="saveR()">Save Recipe</button><button class="secondary" onclick="show('recipes')">Cancel</button></div></div>`}
function saveR(){let r={id:uid(),name:rn.value.trim(),cat:rc.value,servings:+rsv.value||1,cal:+rcl.value||0,pro:+rp.value||0,carb:+rcb.value||0,fat:+rf.value||0,ingredients:ri.value.split(/\n/).map(x=>x.trim()).filter(Boolean),directions:rd.value.trim(),source:"Imported/Custom"};if(!r.name)return alert("Enter a recipe name.");s.recipes.push(r);save();show("recipes")}
function delR(id){if(confirm("Delete this recipe?")){s.recipes=s.recipes.filter(r=>r.id!==id);save();show("recipes")}}
function webImport(){let u=prompt("Paste the recipe website URL:");if(!u)return;alert("For this version, open the recipe page, copy its recipe text, then paste it into the Notes import box. This avoids website cross-origin restrictions.");notesImport()}
function notesImport(){let t=prompt("Paste the recipe text copied from iPhone Notes:");if(!t)return;let ls=t.split(/\n/).map(x=>x.trim()).filter(Boolean),name=ls[0]||"Imported Recipe",ing=[],dir=[],mode="";ls.slice(1).forEach(x=>{if(/^(ingredients?|what you need)/i.test(x)){mode="i";return}if(/^(directions?|instructions?|method|steps?)/i.test(x)){mode="d";return}if(mode==="i")ing.push(x);else if(mode==="d")dir.push(x)});if(!ing.length)ing=ls.slice(1).slice(0,30);recipeForm({name,ingredients:ing,directions:dir.join(" ")})}
function plan(){let u=me(),base=new Date(),days=Array.from({length:7},(_,i)=>{let d=new Date(base);d.setDate(base.getDate()+i);return d.toISOString().slice(0,10)}),p=s.plans[u.id]||{};app.innerHTML=`<div class="card"><h2>Weekly Meal Plan</h2><p class="muted">Generate a 7-day plan for ${esc(u.name)} using ${u.cal} calories and ${u.pro}g protein/day.</p><button onclick="genWeek()">Generate / Regenerate Week</button></div>`+days.map(d=>`<div class="card"><h3>${new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</h3>${(p[d]||[]).map(id=>{let r=R(id);return`<div class="row" style="justify-content:space-between;padding:6px 0"><span>${esc(r.name)} <span class="badge">${r.cat}</span></span><button class="danger" onclick="rmPlan('${d}','${id}')">Remove</button></div>`}).join("")||"<p class='muted'>No meals planned.</p>"}<button class="secondary" onclick="addPlan('${d}')">＋ Add meal</button></div>`).join("")}
function genWeek(){let u=me(),cs={};["Breakfast","Lunch","Dinner","Snack"].forEach(c=>cs[c]=s.recipes.filter(r=>r.cat===c));s.plans[u.id]={};for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()+i);let k=d.toISOString().slice(0,10),a=[];["Breakfast","Lunch","Dinner","Snack"].forEach((c,j)=>{if(cs[c].length)a.push(cs[c][(i+j)%cs[c].length].id)});let p=a.reduce((x,id)=>x+R(id).pro,0);if(p<u.pro&&cs.Snack.length)a.push(cs.Snack[(i+2)%cs.Snack.length].id);s.plans[u.id][k]=a}save();plan()}
function addPlan(d){let q=prompt("Enter recipe ID to add:\\n\\n"+s.recipes.map(r=>r.id+" — "+r.name).join("\\n"));if(!q)return;let id=q.split("—")[0].trim();if(!R(id))return alert("Recipe ID not found.");s.plans[me().id]??={};s.plans[me().id][d]??=[];s.plans[me().id][d].push(id);save();plan()}
function rmPlan(d,id){s.plans[me().id][d]=s.plans[me().id][d].filter(x=>x!==id);save();plan()}
function grocery(){let p=s.plans[me().id]||{},c={};Object.values(p).flat().forEach(id=>{let r=R(id);if(r)r.ingredients.forEach(x=>c[x]=(c[x]||0)+1)});let done=s.groceries[me().id]||{};app.innerHTML=`<div class="card"><h2>Grocery List</h2><p class="muted">Built from this user's weekly meal plan. Quantities are preserved as entered; repeated ingredients are counted.</p><button onclick="window.print()">🖨 Print / Save PDF</button></div><div class="card">${Object.entries(c).map(([x,n])=>`<div class="check"><input type="checkbox" ${done[x]?"checked":""} onchange="gcheck('${encodeURIComponent(x)}')"><span>${esc(x)} ${n>1?`<span class="badge">used ${n}×</span>`:""}</span></div>`).join("")||"<p class='muted'>Generate a meal plan first.</p>"}</div>`}
function gcheck(k){k=decodeURIComponent(k);s.groceries[me().id]??={};s.groceries[me().id][k]=!s.groceries[me().id][k];save();grocery()}
function family(){app.innerHTML=`<div class="card"><h2>Family Users</h2><p class="muted">Each person has separate meal plans, food tracking, water and progress. Recipes are shared.</p>${s.users.map(u=>`<div class="recipe"><div class="row" style="justify-content:space-between"><b>${esc(u.name)} <span class="badge">${u.role}</span></b><button onclick="switchU('${u.id}')">Use Profile</button></div><div class="muted">${u.cal} cal • ${u.pro}g protein • goal ${u.goalMin}–${u.goalMax} lb</div></div>`).join("")}<button onclick="addU()">＋ Add Family Member</button></div>`}
function switchU(id){s.active=id;save();show("home")}
function addU(){let n=prompt("Family member name:");if(!n)return;let c=+prompt("Daily calorie target:",1800)||1800,p=+prompt("Daily protein target (g):",140)||140;s.users.push({id:uid(),name:n,role:"Family",cal:c,pro:p,fat:60,water:80,goalMin:0,goalMax:0});save();family()}
function progress(){let a=s.weights[me().id]||[];app.innerHTML=`<div class="card"><h2>${esc(me().name)} Progress</h2><form onsubmit="addW(event)"><label>Weight (lb)</label><input id="wt" type="number" step=".1" required><button>Add Check-in</button></form></div><div class="card"><h2>Weight History</h2>${a.slice().reverse().map(x=>`<div class="row" style="justify-content:space-between;padding:7px 0"><span>${x.date}</span><b>${x.weight} lb</b></div>`).join("")||"<p class='muted'>No check-ins yet.</p>"}</div>`}
function addW(e){e.preventDefault();s.weights[me().id]??=[];s.weights[me().id].push({date:today(),weight:+wt.value});save();progress()}
function settings(){let u=me();app.innerHTML=`<div class="card"><h2>Profile Settings</h2><div class="two"><div><label>Calories</label><input id="sc" value="${u.cal}" type="number"></div><div><label>Protein</label><input id="sp" value="${u.pro}" type="number"></div><div><label>Fat</label><input id="sf" value="${u.fat}" type="number"></div><div><label>Water (oz)</label><input id="sw" value="${u.water}" type="number"></div></div><button onclick="saveSet()">Save</button></div>
<div class="card"><h2>Backup</h2><button onclick="backup()">Export JSON</button> <label class="btn secondary" style="display:inline-block;width:auto">Import JSON<input type="file" accept=".json" style="display:none" onchange="restore(event)"></label><button class="danger" onclick="resetAll()">Reset App</button></div>`}
function saveSet(){let u=me();u.cal=+sc.value||u.cal;u.pro=+sp.value||u.pro;u.fat=+sf.value||u.fat;u.water=+sw.value||u.water;save();show("settings")}
function backup(){let a=document.createElement("a"),b=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});a.href=URL.createObjectURL(b);a.download="fitfuel-family-backup.json";a.click()}
function restore(e){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{s=JSON.parse(r.result);save();show("home")}catch(x){alert("Invalid backup.")}};r.readAsText(f)}
function resetAll(){if(confirm("Erase all FitFuel data on this device?")){s=fresh();save();show("home")}}
show("home");
</script></body></html>
